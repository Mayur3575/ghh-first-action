name: Delete DynamoDB Attribute

on:
  workflow_dispatch:
    inputs:
      table_name:
        description: 'DynamoDB Table Name'
        required: true
        type: string
      partition_key_name:
        description: 'Partition Key Name'
        required: true
        type: string
      partition_key_value:
        description: 'Partition Key Value'
        required: true
        type: string
      attribute_name:
        description: 'Attribute (column) to remove'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1

jobs:
  remove-dynamodb-attribute:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-DynamoDB-RemoveAttr

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Remove attribute from DynamoDB entry
        run: |
          KEY_JSON="{\"${{ inputs.partition_key_name }}\":{\"S\":\"${{ inputs.partition_key_value }}\"}}"
          echo "Removing attribute '${{ inputs.attribute_name }}' from item with key: $KEY_JSON"
          aws dynamodb update-item \
            --table-name "${{ inputs.table_name }}" \
            --key "$KEY_JSON" \
            --update-expression "REMOVE #attr" \
            --expression-attribute-names "{\"#attr\": \"${{ inputs.attribute_name }}\"}" \
            --return-values ALL_NEW \
            --region ${{ env.AWS_REGION }}

      - name: Confirm removal
        run: |
          echo "Attribute '${{ inputs.attribute_name }}' removed from DynamoDB item"
          echo "Table: ${{ inputs.table_name }}"
          echo "Partition Key: ${{ inputs.partition_key_name }} = ${{ inputs.partition_key_value }}"
