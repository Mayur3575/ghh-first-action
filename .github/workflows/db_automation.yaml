name: Setup Oracle Instant Client via Docker

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  setup-oracle-instant-client:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Oracle Instant Client in Docker
        run: |
          echo "Running Oracle Instant Client in Docker container..."

          docker run --rm -i oraclelinux:7-slim bash -c "
            yum -y install oracle-release-el7 &&
            yum-config-manager --enable ol7_oracle_instantclient &&
            yum -y install oracle-instantclient19.8-basic oracle-instantclient19.8-sqlplus &&
            sqlplus -v
          "
